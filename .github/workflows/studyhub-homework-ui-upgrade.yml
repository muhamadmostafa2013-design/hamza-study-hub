name: Study Hub offline homework upgrade
'on':
  push:
    branches: ['review/studyhub-homework-ui-upgrade-20261127']

permissions:
  contents: read

concurrency:
  group: studyhub-synthetic-homework-ui-upgrade
  cancel-in-progress: true

jobs:
  debug-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERSION_CODE: '20261127'
      VERSION_NAME: '0.5.4-qa'
    steps:
      - name: Check out pinned privacy candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 7618495fc586481dec57154898c187454acf3562
          persist-credentials: false

      - name: Verify candidate and preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7618495fc586481dec57154898c187454acf3562"
          printf 'Runner ImageOS=%s ImageVersion=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          sdk="${ANDROID_SDK_ROOT:?Android SDK unavailable}"
          test -f "$sdk/platforms/android-37.0/android.jar"
          test -x "$sdk/build-tools/37.0.0/aapt2"
          test -x "$sdk/build-tools/37.0.0/apksigner"
          cat "$sdk/platforms/android-37.0/source.properties" "$sdk/build-tools/37.0.0/source.properties"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          python3 scripts/check_backup_policy.py

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.5.0'
          cache-disabled: true

      - name: Build candidate debug APK for the UI test
        shell: bash
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify debug APK identity and packaged backup attributes
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          tools="$ANDROID_HOME/build-tools/37.0.0"
          sha256sum "$apk"
          "$tools/apksigner" verify --print-certs "$apk"
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/studyhub-badging.txt"
          grep -F "package: name='com.hamza.studyhub.debug'" "$RUNNER_TEMP/studyhub-badging.txt"
          "$tools/aapt2" dump xmltree --file AndroidManifest.xml "$apk" > "$RUNNER_TEMP/studyhub-manifest.txt"
          grep -E 'allowBackup.*(false|0x0)$' "$RUNNER_TEMP/studyhub-manifest.txt"
          grep -F 'fullBackupContent' "$RUNNER_TEMP/studyhub-manifest.txt"
          grep -F 'dataExtractionRules' "$RUNNER_TEMP/studyhub-manifest.txt"
          python3 -c 'from zipfile import ZipFile; z=ZipFile("app/build/outputs/apk/debug/app-debug.apk"); assert {"res/xml/backup_rules.xml","res/xml/data_extraction_rules.xml"} <= set(z.namelist())'

      - name: Check out prior build for same-signer update
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: e27882d077e07989d8022fd72f4a0b3a3db97aa8
          path: upgrade-base
          persist-credentials: false

      - name: Build prior debug APK and compare signers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upgrade-base rev-parse HEAD)" = "e27882d077e07989d8022fd72f4a0b3a3db97aa8"
          VERSION_CODE=20261126 VERSION_NAME=0.5.4-prior gradle --no-daemon -p upgrade-base :app:assembleDebug --stacktrace
          prev=upgrade-base/app/build/outputs/apk/debug/app-debug.apk
          next=app/build/outputs/apk/debug/app-debug.apk
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$apksigner" verify --print-certs "$prev" > "$RUNNER_TEMP/studyhub-prev-signer.txt"
          "$apksigner" verify --print-certs "$next" > "$RUNNER_TEMP/studyhub-next-signer.txt"
          python3 - "$RUNNER_TEMP/studyhub-prev-signer.txt" "$RUNNER_TEMP/studyhub-next-signer.txt" <<'CERT_CHECK'
          import re
          import sys
          from pathlib import Path
          
          FINGERPRINT = re.compile(
              r"[ \t]*(?:V2 Signer: certificate|Signer #[1-9][0-9]* certificate)"
              r" SHA-256 digest:[ \t]*([0-9a-f]{64})[ \t]*", re.IGNORECASE
          )
          
          
          def fingerprint(out, label):
              matches = [m.group(1).lower() for line in out.splitlines()
                         if (m := FINGERPRINT.fullmatch(line))]
              if len(matches) != 1:
                  raise ValueError(f"{label}: expected exactly one APK signing digest, found {len(matches)}")
              return matches[0]
          
          
          def same_signer(previous, candidate):
              if fingerprint(previous, "prior APK") != fingerprint(candidate, "candidate APK"):
                  raise ValueError("Verified debug APK signer fingerprints differ")
          
          
          def selftest():
              one = "a" * 64
              old = "Signer #1 certificate SHA-256 digest: " + one
              new = "V2 Signer: certificate SHA-256 digest: " + one.upper()
              same_signer(old, new)
              checks = [
                  ("", new, "found 0"),
                  (old + "\n" + old, new, "found 2"),
                  (old[:-1], new, "found 0"),
                  (old, new[:-1] + "B", "fingerprints differ"),
              ]
              for prev, nxt, want in checks:
                  try:
                      same_signer(prev, nxt)
                  except ValueError as exc:
                      if want not in str(exc):
                          raise
                  else:
                      raise AssertionError(f"Expected parser rejection: {want}")
              print("Signer parser fixtures passed: format variants, empty, ambiguous, malformed and unequal")
          
          
          selftest()
          if len(sys.argv) == 3:
              try:
                  same_signer(*(Path(file).read_text(encoding="utf-8") for file in sys.argv[1:]))
              except (ValueError, OSError) as exc:
                  sys.exit(str(exc))
              print("Prior and candidate APKs share one verified debug signer.")
          CERT_CHECK
          aapt2="$ANDROID_HOME/build-tools/37.0.0/aapt2"
          "$aapt2" dump badging "$prev" > "$RUNNER_TEMP/studyhub-prev-identity.txt"
          "$aapt2" dump badging "$next" > "$RUNNER_TEMP/studyhub-next-identity.txt"
          grep -F "package: name='com.hamza.studyhub.debug' versionCode='20261126'" "$RUNNER_TEMP/studyhub-prev-identity.txt"
          grep -F "package: name='com.hamza.studyhub.debug' versionCode='20261127'" "$RUNNER_TEMP/studyhub-next-identity.txt"
          sha256sum "$prev" "$next"

      - name: Enable hardware acceleration on disposable runner
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-studyhub.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare synthetic UI test harness
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/studyhub-homework-ui-upgrade.py" <<'PYTHON'
          import json
          import re
          import subprocess
          import time
          import xml.etree.ElementTree as ET

          PACKAGE = "com.hamza.studyhub.debug"
          LAUNCHER = f"{PACKAGE}/com.hamza.studyhub.LaunchActivity"
          PREVIOUS = "upgrade-base/app/build/outputs/apk/debug/app-debug.apk"
          CANDIDATE = "app/build/outputs/apk/debug/app-debug.apk"
          HOMEWORK = "Hausaufgabe Deutsch Seite 12 Aufgabe 3 SYNTHETIC-UPGRADE-QA-42"
          DUMP = "/data/local/tmp/studyhub-synthetic-window.xml"


          def adb(*args):
              return subprocess.check_output(["adb", *args], text=True, encoding="utf-8", timeout=90).strip()


          def snapshot():
              try:
                  adb("shell", "rm", "-f", DUMP)
                  adb("shell", "uiautomator", "dump", DUMP)
                  doc = ET.fromstring(adb("shell", "cat", DUMP))
                  nodes = list(doc.iter("node"))
                  deny = next((n for n in nodes
                               if n.get("package", "").endswith(".permissioncontroller")
                               and n.get("resource-id", "").endswith(":id/permission_deny_button")), None)
                  if deny is not None:
                      tap_node("decline optional OS permission", deny)
                      print("Declined optional OS permission using the system UI.", flush=True)
                      return []
                  return [n for n in nodes if n.get("package") == PACKAGE]
              except (ET.ParseError, subprocess.CalledProcessError):
                  return []


          def find(stage, predicate, scroll=False):
              for attempt in range(10):
                  nodes = snapshot()
                  found = [n for n in nodes if predicate(n)]
                  if found:
                      return found[0]
                  if scroll and attempt < 6:
                      adb("shell", "input", "swipe", str(width // 2), str(height * 3 // 4), str(width // 2), str(height // 3), "350")
                  time.sleep(0.5)
              activities = adb("shell", "dumpsys", "activity", "activities")
              foreground = next((line.strip() for line in activities.splitlines() if "mResumedActivity" in line or "topResumedActivity" in line), "unknown")
              screen_match = re.search(rf"{re.escape(PACKAGE)}/([.A-Za-z0-9]+)", foreground)
              state = screen_match.group(1) if screen_match else "non-app or unavailable"
              raise AssertionError(f"Expected app UI not visible: {stage}. Foreground: {state}. App nodes: {len(nodes)}.")


          def label(*labels):
              expected = {label.casefold() for label in labels}
              return lambda node: (node.get("text", "").casefold() in expected
                                   or node.get("content-desc", "").casefold() in expected)


          def tap(stage, predicate, scroll=False):
              def operable(node):
                  bounds = list(map(int, re.findall(r"\d+", node.get("bounds", ""))))
                  return (len(bounds) == 4 and bounds[2] - bounds[0] >= 30 and
                          bounds[3] - bounds[1] >= 30 and node.get("clickable") == "true"
                          and node.get("enabled") == "true" and predicate(node))
              tap_node(stage, find(stage, operable, scroll))


          def tap_node(stage, node):
              left, top, right, bottom = map(int, re.findall(r"\d+", node.attrib["bounds"]))
              assert left < right and top < bottom, f"Non-visible bounds: {stage}"
              adb("shell", "input", "tap", str((left + right) // 2), str((top + bottom) // 2))


          def trace_open_failure(stage):
              activities = adb("shell", "dumpsys", "activity", "activities")
              activity_names = re.findall(rf"{re.escape(PACKAGE)}/(?:com\.hamza\.studyhub)?(\.[A-Za-z0-9.]+)", activities)
              print(f"{stage}: test-app activity records: {sorted(set(activity_names))}", flush=True)
              windows = adb("shell", "dumpsys", "window")
              focused = next((line for line in windows.splitlines() if "mCurrentFocus=" in line), "")
              focus_package = re.search(r"\b([A-Za-z][A-Za-z0-9_.]+)[/:]", focused)
              print(f"{stage}: focused package: {focus_package.group(1) if focus_package else 'unknown'}", flush=True)
              crashes = adb("logcat", "-b", "crash", "-d", "-t", "140", "-v", "raw")
              for record in re.split(r"(?=FATAL EXCEPTION:)", crashes):
                  if re.search(rf"^Process: {re.escape(PACKAGE)}, PID: \d+$", record, re.M):
                      print(f"{stage}: Android crash buffer for the synthetic test app:", flush=True)
                      for line in record.splitlines()[:45]:
                          print(line, flush=True)


          def assert_local_fixture(stage):
              raw = adb("exec-out", "run-as", PACKAGE, "cat", "files/school_notifications.jsonl")
              data = [json.loads(line) for line in raw.splitlines() if line.strip()]
              assert len(data) == 1, f"{stage}: expected exactly one synthetic record"
              assert data[0].get("bigText") == HOMEWORK, f"{stage}: persisted fixture differs"
              assert data[0].get("evidenceTrust") == "COMMUNITY", f"{stage}: persisted trust differs"
              print(f"{stage}: independently confirmed exact synthetic record in app-private storage (read-only).", flush=True)


          def deny_optional_notifications():
              # Establish an existing user opt-out on this disposable emulator only.
              permission = "android.permission.POST_NOTIFICATIONS"
              adb("shell", "pm", "revoke", "--user", "0", PACKAGE, permission)
              adb("shell", "pm", "set-permission-flags", "--user", "0", PACKAGE, permission, "user-set", "user-fixed")
              installed = adb("shell", "dumpsys", "package", PACKAGE)
              runtime = [line for line in installed.splitlines()
                         if f"{permission}:" in line and "granted=false" in line and "USER_FIXED" in line]
              assert runtime, "Notification opt-out could not be verified on the disposable emulator"
              print("Disposable emulator: notification permission stays denied.", flush=True)


          def verify_version(version):
              installed = adb("shell", "dumpsys", "package", PACKAGE)
              assert re.search(rf"\bversionCode={version}\b", installed), "Unexpected installed version"


          def launch_and_skip():
              assert "Status: ok" in adb("shell", "am", "start", "-W", "-n", LAUNCHER)
              tap("offline setup", label("فتح البرنامج بدون ربط الآن"), scroll=True)


          def assert_card(stage, use_all_tab=False):
              if use_all_tab:
                  tap("all assignments", label("الكل"))
              find("homework screen title", label("واجبات حمزة"))
              find(stage, lambda n: n.get("text") == HOMEWORK, scroll=True)
              find("manual/unverified provenance", label("WhatsApp • معلومة غير رسمية"), scroll=True)
              print(f"{stage}: exact synthetic homework and manual provenance visible.", flush=True)


          assert adb("shell", "getprop", "ro.build.version.sdk") == "35"
          adb("shell", "cmd", "connectivity", "airplane-mode", "enable")
          adb("shell", "svc", "wifi", "disable")
          adb("shell", "svc", "data", "disable")
          assert adb("shell", "settings", "get", "global", "airplane_mode_on") == "1"
          size = re.findall(r"(\d+)x(\d+)", adb("shell", "wm", "size"))
          width, height = map(int, size[-1])
          assert width > 0 and height > width
          print(f"Offline API 35, display {width}x{height}", flush=True)

          assert "Success" in adb("install", PREVIOUS)
          verify_version("20261126")
          deny_optional_notifications()
          launch_and_skip()
          tap("manual import at home", label("إضافة واجب من واتساب", "Aufgabe aus WhatsApp hinzufügen"), scroll=True)
          tap("homework editor", lambda n: n.get("class") == "android.widget.EditText")
          adb("shell", "input", "text", HOMEWORK.replace(" ", "%s"))
          find("exact editable homework", lambda n: n.get("class") == "android.widget.EditText" and n.get("text") == HOMEWORK)
          ime = adb("shell", "dumpsys", "input_method")
          if "mInputShown=true" in ime or "mIsInputViewShown=true" in ime:
              adb("shell", "input", "keyevent", "KEYCODE_BACK")
          save = label("Save homework", "Hausaufgabe speichern", "حفظ الواجب")
          tap("request homework save", save, scroll=True)
          find("unverified save confirmation", lambda n: any(s in n.get("text", "") for s in (
              "unverified", "unbestätigt", "غير مؤكد"
          )))
          tap("confirm save on device", lambda n: n.get("resource-id") == "android:id/button1")
          find("save success", label("Homework saved on this device as unverified.", "Hausaufgabe als unbestätigt auf diesem Gerät gespeichert.", "تم حفظ الواجب على هذا الجهاز باعتباره غير مؤكد."))
          tap("open homework from confirmation", label("Open homework", "Hausaufgaben öffnen", "فتح الواجبات"))
          assert_card("Prior version", use_all_tab=True)
          assert_local_fixture("Prior version")
          featured = label("ابدأ الواجب", "Hausaufgabe beginnen", "كمّل الواجب", "Hausaufgabe fortsetzen")
          adb("logcat", "-b", "crash", "-c")
          adb("shell", "am", "force-stop", PACKAGE)
          launch_and_skip()
          tap("open prior featured assignment", featured)
          try:
              assert_card("Prior featured assignment")
          except AssertionError:
              trace_open_failure("Prior featured assignment")

          adb("logcat", "-b", "crash", "-c")
          adb("shell", "am", "force-stop", PACKAGE)
          assert "Success" in adb("install", "-r", CANDIDATE)
          verify_version("20261127")
          deny_optional_notifications()
          assert_local_fixture("Upgraded version")
          launch_and_skip()
          tap("open featured assignment from home", featured)
          print("Candidate home featured an existing assignment.", flush=True)
          try:
              assert_card("Upgraded version")
          except AssertionError:
              trace_open_failure("Candidate featured assignment")
              raise
          adb("shell", "rm", "-f", DUMP)
          print("STUDYHUB_OFFLINE_HOMEWORK_UI_UPGRADE_PASS: prior UI save, installed upgrade, and candidate UI readback. Not a transfer or production build.", flush=True)
          PYTHON
          python3 -m py_compile "$RUNNER_TEMP/studyhub-homework-ui-upgrade.py"

      - name: Save and reopen synthetic homework across offline debug upgrade
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 "$RUNNER_TEMP/studyhub-homework-ui-upgrade.py"
